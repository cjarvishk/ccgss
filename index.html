            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||

          }

          if (view === 'loading') {
              return <div className="h-full w-full bg-gray-900 flex items-center justify-center text-white">Loading...</div>;
          }

          return (
            <div className="h-full w-full bg-gray-900 text-white font-sans flex flex-col">
              {view === 'menu' && <MainMenu initialRoomCode={roomCode} onHost={() => setView('host')} onJoin={(code, name) => { setRoomCode(code); setPlayerName(name); setView('player'); window.history.replaceState({}, '', window.location.pathname); }} />}
              {view === 'host' && <HostConsole onExit={() => setView('menu')} />}
              {view === 'player' && <PlayerClient roomCode={roomCode} playerName={playerName} onExit={() => setView('menu')} />}
            </div>
          );
        }

        function MainMenu({ initialRoomCode, onHost, onJoin }) {
          const [joinCode, setJoinCode] = useState(initialRoomCode || '');
          const [name, setName] = useState('');
          
          const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

          return (
            <div className="flex flex-col items-center justify-center h-full space-y-8 p-4">
              <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-green-400 text-center">P2P TETRIS</h1>
              <div className="flex flex-col md:flex-row gap-8 w-full max-w-4xl">
                {!isMobile && (
                  <div className="flex-1 bg-gray-800 p-8 rounded-2xl border border-gray-700 flex flex-col items-center">
                    <h2 className="text-2xl font-bold mb-4">主機看板 (電腦)</h2>
                    <button onClick={onHost} className="w-full py-4 bg-blue-600 rounded-xl font-bold text-xl hover:bg-blue-500 transition-colors">建立房間</button>
                  </div>
                )}
                <div className="flex-1 bg-gray-800 p-8 rounded-2xl border border-gray-700 flex flex-col">
                  <h2 className="text-2xl font-bold mb-4 text-center">玩家 (iPad/手機)</h2>
                  <input type="text" placeholder="暱稱" value={name} onChange={(e) => setName(e.target.value)} className="bg-gray-900 p-4 rounded-xl mb-4 text-center text-xl outline-none focus:ring-2 focus:ring-green-500" />
                  <input type="text" placeholder="房間代碼" value={joinCode} onChange={(e) => setJoinCode(e.target.value.substring(0,4))} className="bg-gray-900 p-4 rounded-xl mb-4 text-center text-xl outline-none" />
                  <button onClick={() => onJoin(joinCode, name)} disabled={!name || joinCode.length !== 4} className="w-full py-4 bg-green-600 disabled:opacity-50 rounded-xl font-bold text-xl hover:bg-green-500 transition-colors">加入遊戲</button>
                </div>
              </div>
              {isMobile && (
                <p className="text-gray-500 text-sm">偵測到行動裝置：請輸入代碼或掃描 QR Code 加入。</p>
              )}
            </div>
          );
        }

        // Helper function to generate shuffled array
        function generateShuffledIndices() {
            const arr = Array.from({length: BAFS_QUESTIONS.length}, (_, i) => i);
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function HostConsole({ onExit }) {
          const [roomCode, setRoomCode] = useState('');
          const [players, setPlayers] = useState({});
          const playersRef = useRef(players);
          
          const [roomStatus, setRoomStatus] = useState('waiting');
          const roomStatusRef = useRef(roomStatus);
          
          const [gameMode, setGameMode] = useState('easy'); 
          const gameModeRef = useRef(gameMode);
          
          const [showQR, setShowQR] = useState(true);
          const [selectedPlayerId, setSelectedPlayerId] = useState(null);
          const [speedUpCooldown, setSpeedUpCooldown] = useState(false);
          const [autoAttackTimer, setAutoAttackTimer] = useState(30);
          
          const peerRef = useRef(null);
          const qrRef = useRef(null);
          const connectionsRef = useRef({});

          // Q&A States & Randomization
          const [qaStarted, setQaStarted] = useState(false);
          
          // Initializes shuffled indices
          const [shuffledIndices, setShuffledIndices] = useState(generateShuffledIndices);
          
          const [qStep, setQStep] = useState(0); 
          const qIndex = shuffledIndices[qStep]; 

          const [qaTimeLeft, setQaTimeLeft] = useState(15);
          const [qaShowAnswer, setQaShowAnswer] = useState(false);

          useEffect(() => {
            roomStatusRef.current = roomStatus;
          }, [roomStatus]);

          useEffect(() => {
            playersRef.current = players;
          }, [players]);
          
          useEffect(() => {
            gameModeRef.current = gameMode;
          }, [gameMode]);

          useEffect(() => {
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            setRoomCode(code);
            const peer = new window.Peer(`${APP_PREFIX}${code}`);
            peerRef.current = peer;
            peer.on('connection', (conn) => {
              connectionsRef.current[conn.peer] = conn;
              conn.on('data', (data) => {
                if (data.type === 'join') {
                  if (roomStatusRef.current === 'playing') {
                     conn.send({ type: 'status', status: 'rejected' });
                     setTimeout(() => conn.close(), 500); 
                     return;
                  }
                  if (Object.keys(playersRef.current).length >= 10) {
                     conn.send({ type: 'status', status: 'full' });
                     setTimeout(() => conn.close(), 500); 
                     return;
                  }
                  
                  setPlayers(p => ({...p, [conn.peer]: {id: conn.peer, name: data.name, score: 0, speedLevel: 1, isGameOver: false, grid: createMatrix(COLS, ROWS)}}));
                  conn.send({ type: 'status', status: roomStatusRef.current, gameMode: gameModeRef.current });
                } else if (data.type === 'state') {
                  setPlayers(p => ({...p, [conn.peer]: {...p[conn.peer], ...data}}));
                }
              });
              conn.on('close', () => setPlayers(p => { const n = {...p}; delete n[conn.peer]; return n; }));
            });
            return () => peer.destroy();
          }, []);

          useEffect(() => {
            if (roomCode && qrRef.current) {
              qrRef.current.innerHTML = "";
              const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
              new QRCode(qrRef.current, {
                text: joinUrl,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
              });
            }
          }, [roomCode, showQR]);

          // Auto-Attack Logic for Hard Mode
          useEffect(() => {
            if (roomStatus === 'playing' && gameMode === 'auto') {
              setAutoAttackTimer(30);
              const timer = setInterval(() => {
                setAutoAttackTimer((prev) => {
                  if (prev <= 1) {
                    Object.values(connectionsRef.current).forEach(c => {
                      if (c.open) c.send({ type: 'command', action: 'speedUp' });
                    });
                    setSpeedUpCooldown(true);
                    setTimeout(() => setSpeedUpCooldown(false), 2000);
                    return 30;
                  }
                  return prev - 1;
                });
              }, 1000);
              return () => clearInterval(timer);
            }
          }, [roomStatus, gameMode]);

          // Q&A Timer Logic
          useEffect(() => {
            if (!qaStarted) return;
            
            let timer;
            if (qaShowAnswer) {
              timer = setTimeout(() => {
                setQaShowAnswer(false);
                setQStep((prev) => (prev + 1) % BAFS_QUESTIONS.length);
                setQaTimeLeft(15);
              }, 3000);
            } else {
              if (qaTimeLeft > 0) {
                timer = setTimeout(() => setQaTimeLeft((prev) => prev - 1), 1000);
              } else {
                setQaShowAnswer(true);
              }
            }
            return () => clearTimeout(timer);
          }, [qaTimeLeft, qaShowAnswer, qaStarted]);

          useEffect(() => {
            Object.values(connectionsRef.current).forEach(c => {
              if (c.open) {
                c.send({ 
                  type: 'qa_state', 
                  started: qaStarted, 
                  qIndex: qIndex, 
                  timeLeft: qaTimeLeft, 
                  showAnswer: qaShowAnswer 
                });
              }
            });
          }, [qaStarted, qIndex, qaTimeLeft, qaShowAnswer]);

          const broadcastStatus = (status) => {
            setRoomStatus(status);
            Object.values(connectionsRef.current).forEach(c => c.open && c.send({ type: 'status', status, gameMode: gameModeRef.current }));
            
            if (status === 'playing') {
                setShowQR(false);
                // 每次點擊 START GAME 時，重新隨機洗牌題目順序
                setShuffledIndices(generateShuffledIndices());
                setQStep(0); 
            } else if (status === 'waiting') {
                setQaStarted(false);
                setQStep(0); 
                setQaTimeLeft(15);
                setQaShowAnswer(false);
            }
          };

          const handleManualSpeedUp = () => {
            const conn = connectionsRef.current[selectedPlayerId];
            if (selectedPlayerId && conn) {
              conn.send({ type: 'command', action: 'speedUp' });
              
              setSpeedUpCooldown(true);
              setTimeout(() => setSpeedUpCooldown(false), 2000);
            }
          };

          const currentQuestion = BAFS_QUESTIONS[qIndex];
          const playerArray = Object.values(players);
          const bestPlayer = playerArray.length > 0 ? playerArray.reduce((max, p) => (p.score || 0) > (max.score || 0) ? p : max, playerArray[0]) : null;

          return (
            <div className="h-full flex flex-col p-4 bg-slate-950">
              <div className="flex flex-col lg:flex-row justify-between items-center bg-gray-800 p-4 rounded-2xl mb-4 gap-4 shrink-0 shadow-lg relative">
                
                <div className="flex items-center gap-6 z-10 w-full lg:w-auto justify-center lg:justify-start">
                  <div className="text-3xl lg:text-4xl font-mono font-black text-blue-400">ROOM: {roomCode}</div>
                  <button onClick={() => setShowQR(!showQR)} className="text-xs bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">
                    {showQR ? "隱藏 QR Code" : "顯示 QR Code"}
                  </button>
                </div>
                
                {bestPlayer && bestPlayer.score > 0 && (
                  <div className="z-0 lg:absolute lg:left-1/2 lg:transform lg:-translate-x-1/2 flex flex-col items-center pointer-events-none">
                    <span className="text-sm font-bold text-yellow-500 tracking-wider">🏆 目前領先</span>
                    <span className="text-3xl font-black text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.5)]">
                      {bestPlayer.name} ({bestPlayer.score})
                    </span>
                  </div>
                )}
                
                <div className="flex flex-wrap justify-center gap-2 lg:gap-4 z-10 w-full lg:w-auto items-center">
                  {roomStatus === 'waiting' && (
                    <select 
                      value={gameMode}
                      onChange={(e) => setGameMode(e.target.value)}
                      className="px-4 py-2.5 bg-gray-700 text-white rounded-xl font-bold outline-none cursor-pointer border border-gray-600 appearance-none"
                    >
                      <option value="easy">🟢 簡單 (無自動加速)</option>
                      <option value="auto">🔴 困難 (全體自動加速)</option>
                    </select>
                  )}
                  
                  {roomStatus === 'playing' && gameMode === 'auto' && (
                    <div className="px-4 py-2 bg-red-900/50 border border-red-700 text-red-400 rounded-xl font-bold flex items-center gap-2">
                      ⏳ 自動加速: {autoAttackTimer}s
                    </div>
                  )}

                  <button 
                    onClick={handleManualSpeedUp} 
                    disabled={roomStatus !== 'playing' || !selectedPlayerId || speedUpCooldown} 
                    className={`px-6 py-2 rounded-xl font-bold text-lg transition-all flex items-center gap-2 ${speedUpCooldown || roomStatus !== 'playing' || !selectedPlayerId ? 'bg-gray-700 text-gray-400 cursor-not-allowed' : 'bg-purple-600 hover:bg-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.6)]'}`}
                  >
                    {speedUpCooldown ? '⚡ 已發送' : '⚡ 手動加速'}
                  </button>
                  
                  <button onClick={() => broadcastStatus(roomStatus === 'playing' ? 'waiting' : 'playing')} className={`px-6 py-2 rounded-xl font-bold text-lg transition-colors ${roomStatus === 'waiting' ? 'bg-green-600 hover:bg-green-500' : 'bg-orange-600 hover:bg-orange-500'}`}>
                    {roomStatus === 'waiting' ? 'START GAME' : 'RESET ROOM'}
                  </button>
                  <button onClick={onExit} className="px-6 py-2 bg-red-600 hover:bg-red-500 rounded-xl font-bold text-lg transition-colors">EXIT</button>
                </div>
              </div>

              <div className="flex-1 flex flex-col lg:flex-row gap-4 overflow-hidden">
                
                <div className="w-full lg:w-[350px] xl:w-[400px] bg-gray-800 rounded-2xl p-6 border border-gray-700 shrink-0 shadow-xl flex flex-col overflow-y-auto relative">
                  {!qaStarted ? (
                    <div className="flex-1 flex justify-center items-center py-4 w-full min-h-[200px]">
                      <button 
                        onClick={() => setQaStarted(true)} 
                        className="px-6 py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xl shadow-lg flex items-center gap-3 transition-colors text-left"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        開始 BAFS Q&A 挑戰
                      </button>
                    </div>
                  ) : (
                    <>
                      <div className="flex justify-between items-start mb-4">
                        <h3 className="text-lg font-black text-yellow-400 flex items-center gap-2">
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          挑戰 ({qStep + 1}/{BAFS_QUESTIONS.length})
                        </h3>
                        
                        <div className="relative flex items-center justify-center w-14 h-14 rounded-full border-4 border-gray-600 bg-gray-900 shadow-inner shrink-0">
                          <div className="absolute inset-0 rounded-full border-4 border-transparent border-t-yellow-400 animate-spin" style={{ animationDuration: '3s', opacity: qaShowAnswer ? 0 : 1 }}></div>
                          <span className={`text-xl font-black ${qaTimeLeft <= 5 && !qaShowAnswer ? 'text-red-500 animate-pulse' : 'text-white'}`}>
                            {qaShowAnswer ? 'ANS' : qaTimeLeft}
                          </span>
                        </div>
                      </div>
                      
                      <p className="text-xl font-bold mb-6 text-white">{currentQuestion.q}</p>
                      
                      <div className="flex flex-col gap-3 mt-auto">
                        {currentQuestion.options.map((opt, i) => {
                          let btnClass = 'bg-gray-700 text-gray-200 border-gray-600';
                          if (qaShowAnswer) {
                            if (i === currentQuestion.ans) {
                              btnClass = 'bg-green-600 border-green-400 text-white font-bold shadow-[0_0_15px_rgba(74,222,128,0.5)]';
                            } else {
                              btnClass = 'bg-gray-800 opacity-40 border-gray-800';
                            }
                          }
                          return (
                            <div key={i} className={`p-4 rounded-xl border-2 transition-all duration-300 ${btnClass}`}>
                              {opt}
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>

                <div className="flex-1 flex gap-4 overflow-hidden">
                  <div className="flex-1 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto pr-2 pb-4">
                    {Object.values(players).length === 0 ? (
                      <div className="col-span-full flex flex-col items-center justify-center text-gray-500 italic h-32">
                        <p>等待玩家加入...</p>
                      </div>
                    ) : (
                      Object.values(players).map((p) => (
                        <PlayerMiniBoard 
                          key={p.id} 
                          player={p} 
                          isSelected={selectedPlayerId === p.id}
                          onSelect={() => setSelectedPlayerId(p.id)}
                        />
                      ))
                    )}
                  </div>

                  {showQR && (
                    <div className="w-64 bg-gray-800 rounded-2xl p-6 flex flex-col items-center justify-center border border-gray-700 shrink-0 self-start shadow-xl">
                      <div className="text-center mb-4">
                        <p className="font-bold text-sm mb-1 text-white">掃描加入遊戲</p>
                        <p className="text-xs text-gray-400">讓 iPad/手機掃描二維碼</p>
                      </div>
                      <div id="qrcode" ref={qrRef} className="bg-white p-2 rounded-lg"></div>
                      <div className="mt-4 text-[10px] text-gray-500 break-all text-center font-mono">
                        {window.location.origin}{window.location.pathname}?room={roomCode}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        function PlayerMiniBoard({ player, isSelected, onSelect }) {
          const canvasRef = useRef(null);
          useEffect(() => {
            const ctx = canvasRef.current.getContext('2d');
            ctx.fillStyle = '#111827'; ctx.fillRect(0,0,120,240);
            (player.grid || []).forEach((row, y) => row.forEach((v, x) => { if(v) { ctx.fillStyle = COLORS[v]; ctx.fillRect(x*12, y*12, 11, 11); } }));
            if (player.currentPiece && !player.isGameOver) {
              player.currentPiece.matrix.forEach((row, y) => row.forEach((v, x) => { if(v) { ctx.fillStyle = COLORS[v]; ctx.fillRect((player.currentPiece.pos.x+x)*12, (player.currentPiece.pos.y+y)*12, 11, 11); } }));
            }
          }, [player]);
          
          return (
            <div 
              onClick={onSelect}
              className={`p-2 rounded-xl border-4 cursor-pointer transition-all flex flex-col items-center ${isSelected ? 'bg-gray-800 border-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.6)] transform scale-105 z-10' : 'bg-gray-800 border-gray-700 hover:border-gray-500'}`}
            >
              <div className="flex justify-between w-full text-[10px] font-bold mb-1 px-1">
                <span className="truncate max-w-[50px] text-gray-200">{player.name}</span>
                <span className="text-yellow-400">⚡{player.speedLevel || 1}</span>
                <span className="text-green-400">{player.score || 0}</span>
              </div>
              <div className="relative mt-1">
                <canvas ref={canvasRef} width={120} height={240} className="bg-black rounded border border-gray-900" />
                {player.isGameOver && (
                  <div className="absolute inset-0 bg-red-900/40 flex items-center justify-center rounded">
                    <span className="text-[10px] font-black bg-black px-1 rounded">GAME OVER</span>
                  </div>
                )}
              </div>
            </div>
          );
        }

        function PlayerClient({ roomCode, playerName, onExit }) {
          const [roomStatus, setRoomStatus] = useState('connecting');
          const [score, setScore] = useState(0);
          const [speedLevel, setSpeedLevel] = useState(1);
          const [gameMode, setGameMode] = useState('easy');
          const [isGameOver, setIsGameOver] = useState(false);
          const [flashMsg, setFlashMsg] = useState('');
          const connRef = useRef(null);
          const engineRef = useRef(null);

          const [qaState, setQaState] = useState({ started: false, qIndex: 0, timeLeft: 0, showAnswer: false });
          const [myAnswer, setMyAnswer] = useState(null);

          useEffect(() => {
            const peer = new window.Peer();
            peer.on('open', () => {
              const conn = peer.connect(`${APP_PREFIX}${roomCode}`);
              connRef.current = conn;
              conn.on('open', () => { 
                setRoomStatus('waiting'); 
                conn.send({ type: 'join', name: playerName || '無名氏' }); 
              });
              conn.on('data', (d) => { 
                if (d.type === 'status') {
                  setRoomStatus(d.status); 
                  if (d.gameMode) setGameMode(d.gameMode);
                  if (d.status === 'waiting') {
                      setSpeedLevel(1); 
                  }
                } else if (d.type === 'command' && d.action === 'speedUp') {
                  setSpeedLevel(prev => prev + 1); 
                  setFlashMsg('⚠️ 加速! ⚠️');
                  setTimeout(() => setFlashMsg(''), 2000);
                } else if (d.type === 'qa_state') {
                  setQaState(prev => {
                      if (prev.qIndex !== d.qIndex) {
                          setMyAnswer(null); 
                      }
                      return { started: d.started, qIndex: d.qIndex, timeLeft: d.timeLeft, showAnswer: d.showAnswer };
                  });
                }
              });
              conn.on('close', () => setRoomStatus(prev => (prev === 'rejected' || prev === 'full') ? prev : 'disconnected'));
            });
            return () => peer.destroy();
          }, []);

          const handleUpdate = (s) => {
            setScore(s.score); 
            setIsGameOver(s.isGameOver);
            if(connRef.current?.open) connRef.current.send({ type: 'state', ...s, speedLevel });
          };

          const handleAnswer = (idx) => {
              if (qaState.showAnswer || myAnswer !== null) return;
              setMyAnswer(idx);
              
              if (idx === BAFS_QUESTIONS[qaState.qIndex].ans) {
                  engineRef.current?.addScore(500);
                  setFlashMsg('✅ 答對了! +500分 ✅');
                  setTimeout(() => setFlashMsg(''), 2000);
              } else {
                  setFlashMsg('❌ 答錯了! ❌');
                  setTimeout(() => setFlashMsg(''), 2000);
              }
          };

          const currentQuestion = BAFS_QUESTIONS[qaState.qIndex];

          return (
            <div className="h-full w-full flex flex-col bg-black">
              <div className="p-4 bg-gray-900 flex justify-between items-center shrink-0">
                <button onClick={onExit} className="bg-gray-700 px-4 py-2 rounded-lg font-bold">EXIT</button>
                <div className="flex gap-4 items-center">
                    <div className="text-xl font-bold text-yellow-400 flex items-center gap-1">
                        <span>⚡</span> {speedLevel}
                    </div>
                    <div className="text-xl font-bold text-green-400">SCORE: {score}</div>
                </div>
              </div>

              {roomStatus !== 'playing' ? (
                <div className="flex-1 flex flex-col items-center justify-center gap-4 text-center p-6">
                  <div className="text-2xl font-bold animate-pulse">
                    {roomStatus === 'connecting' && '連線中...'}
                    {roomStatus === 'waiting' && '等待主機開始...'}
                    {roomStatus === 'disconnected' && '與主機斷開連線'}
                    {roomStatus === 'rejected' && '遊戲已開始，無法加入房間'}
                    {roomStatus === 'full' && '房間已滿 (最多 10 人)'}
                  </div>
                  {roomStatus === 'waiting' && (
                    <div className="flex flex-col items-center gap-2">
                        <p className="text-gray-500">你是: {playerName}</p>
                        <p className="text-sm font-bold px-3 py-1 rounded-full bg-gray-800 text-gray-300">
                            模式: {gameMode === 'easy' ? '🟢 簡單 (無自動加速)' : '🔴 困難 (全體自動加速)'}
                        </p>
                    </div>
                  )}
                  {(roomStatus === 'disconnected' || roomStatus === 'rejected' || roomStatus === 'full') && <button onClick={onExit} className="bg-blue-600 px-6 py-2 rounded-xl">返回菜單</button>}
                </div>
              ) : (
                <div className="flex-1 flex flex-col md:flex-row items-center justify-center p-2 gap-4 h-full w-full overflow-hidden">
                  
                  {qaState.started && (
                    <div className="w-full md:w-64 lg:w-80 bg-gray-800 rounded-xl p-4 flex flex-col shrink-0 shadow-lg border border-gray-700 h-auto md:h-[550px] max-h-48 md:max-h-[550px] overflow-y-auto">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-yellow-400 font-bold">Q&A 挑戰</span>
                        <span className={`font-mono font-bold ${qaState.timeLeft <= 5 && !qaState.showAnswer ? 'text-red-500 animate-pulse' : 'text-gray-300'}`}>
                          {qaState.showAnswer ? '答案' : `⏱ ${qaState.timeLeft}s`}
                        </span>
                      </div>
                      <p className="text-sm font-bold text-white mb-4">{currentQuestion.q}</p>
                      <div className="flex flex-col gap-2">
                        {currentQuestion.options.map((opt, i) => {
                          let btnClass = 'bg-gray-700 text-gray-200 border-gray-600 hover:bg-gray-600';
                          
                          if (qaState.showAnswer) {
                            if (i === currentQuestion.ans) btnClass = 'bg-green-600 text-white font-bold border-green-500';
                            else if (i === myAnswer) btnClass = 'bg-red-600 text-white font-bold border-red-500';
                            else btnClass = 'bg-gray-800 text-gray-500 opacity-50';
                          } else if (myAnswer === i) {
                            btnClass = 'bg-blue-600 text-white font-bold border-blue-500';
                          } else if (myAnswer !== null) {
                            btnClass = 'bg-gray-700 text-gray-400 opacity-50 cursor-not-allowed';
                          }

                          return (
                            <button 
                              key={i} 
                              onClick={() => handleAnswer(i)}
                              disabled={myAnswer !== null || qaState.showAnswer}
                              className={`p-2 rounded-lg border-2 text-left text-sm transition-all ${btnClass}`}
                            >
                              {opt}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  <div className="flex-1 flex flex-col items-center justify-evenly w-full h-full max-w-xl">
                    <div className="relative border-4 border-gray-800 rounded-xl bg-gray-900 shadow-2xl shrink-0">
                      
                      <TetrisEngine ref={engineRef} onUpdate={handleUpdate} isActive={!isGameOver} speedLevel={speedLevel} gameMode={gameMode} />
                      
                      {flashMsg && (
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-10 bg-black/40 rounded-lg">
                          <span className="text-3xl md:text-5xl font-black text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,1)] text-center px-2">
                            {flashMsg}
                          </span>
                        </div>
                      )}
                      {isGameOver && <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-3xl font-black text-red-500 z-20">
                          GAME OVER
                          <button onClick={() => window.location.reload()} className="mt-4 text-sm bg-white text-black px-4 py-2 rounded">再玩一次</button>
                      </div>}
                    </div>

                    <div className="w-full flex flex-col gap-3 md:gap-4 px-2 md:px-4 pb-2 md:pb-4 mt-2">
                      <div className="flex justify-between gap-3 md:gap-4">
                         <TouchButton onClick={() => engineRef.current?.move(-1)} icon="◀" label="LEFT" color="bg-blue-600" />
                         <TouchButton onClick={() => engineRef.current?.drop()} icon="▼" label="SOFT" color="bg-gray-600" />
                         <TouchButton onClick={() => engineRef.current?.move(1)} icon="▶" label="RIGHT" color="bg-blue-600" />
                      </div>
                      <div className="flex justify-center gap-3 md:gap-4">
                         <TouchButton onClick={() => engineRef.current?.rotate()} icon="↻" label="ROTATE" color="bg-purple-600" />
                         <TouchButton onClick={() => engineRef.current?.hardDrop()} icon="⏬" label="HARD DROP" color="bg-red-600" />
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function TouchButton({ onClick, icon, label, color }) {
          return (
            <button 
              onPointerDown={(e) => { e.preventDefault(); onClick(); }}
              className={`${color} flex-1 h-16 md:h-24 rounded-2xl flex flex-col items-center justify-center active:scale-90 transition-transform shadow-lg`}
            >
              <span className="text-2xl md:text-3xl font-bold">{icon}</span>
              <span className="text-[10px] font-black opacity-80 uppercase">{label}</span>
            </button>
          );
        }

        const TetrisEngine = React.forwardRef(({ onUpdate, isActive, speedLevel, gameMode }, ref) => {
          const canvasRef = useRef(null);
          const onUpdateRef = useRef(onUpdate);
          useEffect(() => { onUpdateRef.current = onUpdate; }, [onUpdate]);

          const state = useRef({ 
              grid: createMatrix(COLS, ROWS), 
              player: { pos: { x: 0, y: 0 }, matrix: null, score: 0 }, 
              dropCounter: 0, 
              dropInterval: 1000, 
              lastTime: 0, 
              isGameOver: false,
              speedMultiplier: 1.0
          });

          const recalculateSpeed = () => {
             const baseInterval = gameMode === 'easy' 
                 ? 1000 
                 : Math.max(100, 1000 - (state.current.player.score / 5));
             
             const multiplier = Math.pow(0.6, Math.max(1, speedLevel) - 1);
             
             state.current.speedMultiplier = multiplier;
             state.current.dropInterval = Math.max(30, baseInterval * multiplier);
          };

          useEffect(() => {
             recalculateSpeed();
             state.current.dropCounter = 0; 
          }, [speedLevel, gameMode]);

          const collide = (g, p) => {
            const {matrix: m, pos: o} = p;
            for (let y = 0; y < m.length; ++y) {
              for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (g[y + o.y] && g[y + o.y][x + o.x]) !== 0) return true;
              }
            }
            return false;
          };

          const resetPlayer = () => {
            const p = 'IJLOSZT';
            const type = p[p.length * Math.random() | 0];
            state.current.player.matrix = SHAPES['0IJLOSZT'.indexOf(type)];
            state.current.player.pos = { y: 0, x: (COLS / 2 | 0) - (state.current.player.matrix[0].length / 2 | 0) };
            if (collide(state.current.grid, state.current.player)) state.current.isGameOver = true;
          };

          const drop = () => {
            state.current.player.pos.y++;
            if (collide(state.current.grid, state.current.player)) {
              state.current.player.pos.y--;
              state.current.player.matrix.forEach((row, y) => row.forEach((v, x) => { 
                  if (v) state.current.grid[y + state.current.player.pos.y][x + state.current.player.pos.x] = v; 
              }));
              resetPlayer();
              sweep();
            }
            state.current.dropCounter = 0;
          };

          const sweep = () => {
            let rowCount = 1;
            let linesCleared = 0;
            for (let y = state.current.grid.length - 1; y > 0; --y) {
              if (state.current.grid[y].every(v => v !== 0)) {
                const row = state.current.grid.splice(y, 1)[0].fill(0);
                state.current.grid.unshift(row);
                y++;
                state.current.player.score += rowCount * 100;
                rowCount *= 2;
                linesCleared++;
              }
            }
            
            if (linesCleared > 0) {
               recalculateSpeed();
            }
          };

          const update = (time = 0) => {
            if (!isActive || state.current.isGameOver) return;
            const dt = time - state.current.lastTime;
            state.current.lastTime = time;
            state.current.dropCounter += dt;
            if (state.current.dropCounter > state.current.dropInterval) drop();
            draw();
            requestAnimationFrame(update);
          };

          const draw = () => {
            if (!canvasRef.current) return;
            const ctx = canvasRef.current.getContext('2d');
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,250,500);
            
            // 1. 畫出背景已固定的網格 Grid
            state.current.grid.forEach((row, y) => row.forEach((v, x) => { 
                if(v) { 
                    ctx.fillStyle = COLORS[v]; 
                    ctx.fillRect(x*25, y*25, 24, 24); 
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.strokeRect(x*25, y*25, 24, 24);
                } 
            }));

            // 2. 計算並畫出落點預測 (Ghost Piece / Landing Path)
            if (state.current.player.matrix) {
                const ghostPlayer = {
                    matrix: state.current.player.matrix,
                    pos: { x: state.current.player.pos.x, y: state.current.player.pos.y }
                };
                
                while (!collide(state.current.grid, ghostPlayer)) {
                    ghostPlayer.pos.y++;
                }
                ghostPlayer.pos.y--; 

                ctx.globalAlpha = 0.25;
                state.current.player.matrix.forEach((row, y) => row.forEach((v, x) => { 
                    if(v) { 
                        ctx.fillStyle = COLORS[v]; 
                        ctx.fillRect((ghostPlayer.pos.x+x)*25, (ghostPlayer.pos.y+y)*25, 24, 24); 
                        ctx.strokeStyle = 'white';
                        ctx.strokeRect((ghostPlayer.pos.x+x)*25, (ghostPlayer.pos.y+y)*25, 24, 24);
                    } 
                }));
                ctx.globalAlpha = 1.0;
            }
            
            // 3. 畫出當前正在控制的方塊 Current Piece
            state.current.player.matrix?.forEach((row, y) => row.forEach((v, x) => { 
                if(v) { 
                    ctx.fillStyle = COLORS[v]; 
                    ctx.fillRect((state.current.player.pos.x+x)*25, (state.current.player.pos.y+y)*25, 24, 24); 
                    ctx.strokeStyle = 'white';
                    ctx.strokeRect((state.current.player.pos.x+x)*25, (state.current.player.pos.y+y)*25, 24, 24);
                } 
            }));
          };

          React.useImperativeHandle(ref, () => ({
            move: (d) => { state.current.player.pos.x += d; if(collide(state.current.grid, state.current.player)) state.current.player.pos.x -= d; draw(); },
            rotate: () => { 
                const m = state.current.player.matrix;
                if (!m) return;
                const rotated = m[0].map((_, i) => m.map(r => r[i])).map(r => r.reverse());
                const oldPos = state.current.player.pos.x;
                let offset = 1;
                state.current.player.matrix = rotated;
                while (collide(state.current.grid, state.current.player)) {
                    state.current.player.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (Math.abs(offset) > m[0].length) {
                        state.current.player.matrix = m;
                        state.current.player.pos.x = oldPos;
                        return;
                    }
                }
                draw();
            },
            drop,
            hardDrop: () => { 
                if(state.current.isGameOver) return;
                while(!collide(state.current.grid, state.current.player)) state.current.player.pos.y++; 
                state.current.player.pos.y--; 
                drop(); 
            },
            addScore: (points) => {
                if (state.current.isGameOver) return;
                state.current.player.score += points;
                recalculateSpeed();
            }
          }));

          useEffect(() => { 
            resetPlayer(); 
            const animId = requestAnimationFrame(update);
            const si = setInterval(() => {
                if (onUpdateRef.current) {
                    onUpdateRef.current({
                        grid: state.current.grid, 
                        score: state.current.player.score, 
                        isGameOver: state.current.isGameOver, 
                        currentPiece: {matrix: state.current.player.matrix, pos: state.current.player.pos}
                    });
                }
            }, 300);
            return () => {
                cancelAnimationFrame(animId);
                clearInterval(si);
            };
          }, [isActive]);

          return <canvas ref={canvasRef} width={250} height={500} className="bg-slate-900 rounded-lg shadow-2xl" />;
        });

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
